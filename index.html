<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: draw behind the Android gesture bar; the tab bar pads for it -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f8" />
    <!-- Android colours the system bars from this; useTheme keeps it on the chosen theme -->
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Review Club" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <title>Review Club</title>
    <script>
      // Apply the saved or system theme before first paint (see src/hooks/useTheme.ts)
      (function () {
        try {
          var stored = localStorage.getItem('review-club-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0c0c0e');
          }
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <script>
      // Recover from a stale page after a deploy. A cached index.html (browser or
      // service worker) can point at a bundle the new deploy no longer has; the
      // script then fails to load and the page stays blank. When an /assets/ file
      // fails, drop the service worker and caches and reload once per session.
      (function () {
        var KEY = 'review-club-stale-reload';
        function recover() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            return; // No storage: can't guard against a reload loop, so don't reload
          }
          var jobs = [];
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }));
          }
          if ('caches' in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        }
        window.addEventListener('error', function (event) {
          var el = event.target;
          var url = el && (el.src || el.href);
          if (url && (el.tagName === 'SCRIPT' || el.tagName === 'LINK') && url.indexOf('/assets/') !== -1) recover();
        }, true);
        window.addEventListener('vite:preloadError', recover);
        // Clear the guard once the app has actually started
        window.addEventListener('load', function () {
          setTimeout(function () {
            try {
              if (document.getElementById('root').childElementCount > 0) sessionStorage.removeItem(KEY);
            } catch (e) {}
          }, 3000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
